name: Codex Worker

on:
  push:
    branches: [main]
    paths:
      - 'task.md'
  pull_request_target:
    types: [closed]
  workflow_dispatch:

jobs:
  codex-solve-tasks:
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'pull_request_target' || github.event.pull_request.merged == false }}

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Check for TODO tasks
        id: check-tasks
        run: |
          if grep -q "Status: TODO" task.md; then
            echo "has_todos=true" >> $GITHUB_OUTPUT
            echo "✓ Found TODO tasks"
          else
            echo "has_todos=false" >> $GITHUB_OUTPUT
            echo "✓ No TODO tasks, skipping"
          fi

      - name: Create task branch
        if: steps.check-tasks.outputs.has_todos == 'true'
        run: |
          BRANCH_NAME="codex/solve-$(date +%s)"
          git checkout -b "$BRANCH_NAME"
          echo "BRANCH_NAME=$BRANCH_NAME" >> $GITHUB_ENV

      - name: Run Codex to implement tasks
        if: steps.check-tasks.outputs.has_todos == 'true'
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          model: gpt-4o-mini
          prompt-file: .ai/codex.prompt.md
          output-file: codex-output.md
          sandbox: workspace-write
          safety-strategy: drop-sudo

      - name: Validate generated solutions
        if: steps.check-tasks.outputs.has_todos == 'true'
        run: |
          set -euo pipefail
          if command -v rg >/dev/null 2>&1; then
            search() { rg -n "$@"; }
            search_quiet() { rg -n "$@" >/dev/null; }
          else
            search() { grep -n -E "$@"; }
            search_quiet() { grep -n -E "$@" >/dev/null; }
          fi

          mapfile -t TASK_PATHS < <(awk '/^- Path: /{print $3}' task.md)

          if [ "${#TASK_PATHS[@]}" -eq 0 ]; then
            echo "No task paths found in task.md"
            exit 1
          fi

          for path in "${TASK_PATHS[@]}"; do
            solution="${path}/solution.ts"
            test="${path}/solution.test.ts"
            readme="${path}/README.md"

            if [ ! -s "$solution" ]; then
              echo "Missing or empty file: $solution"
              exit 1
            fi

            if [ ! -s "$test" ]; then
              echo "Missing or empty file: $test"
              exit 1
            fi

            if [ ! -s "$readme" ]; then
              echo "Missing or empty file: $readme"
              exit 1
            fi

            if search '\\\\n' "$solution" "$test" "$readme"; then
              echo "Found literal \\n escape sequences in files under $path"
              exit 1
            fi

            if ! search_quiet "node:assert/strict" "$test"; then
              echo "Tests must import node:assert/strict: $test"
              exit 1
            fi

            if search "from ['\\\"]assert['\\\"]" "$test"; then
              echo "Tests must not import from 'assert': $test"
              exit 1
            fi

            if search "describe\\(" "$test" || search "it\\(" "$test" || search "test\\(" "$test" || search "expect\\(" "$test"; then
              echo "Tests must not use a test runner API: $test"
              exit 1
            fi

            if ! search_quiet "from ['\\\"]\\./solution['\\\"]" "$test"; then
              echo "Tests must import from ./solution: $test"
              exit 1
            fi

            if ! search_quiet "\\bexport\\b" "$solution"; then
              echo "solution.ts must export the required function/class: $solution"
              exit 1
            fi

            if ! search_quiet "solution\\.ts" "$readme" || ! search_quiet "solution\\.test\\.ts" "$readme"; then
              echo "README must list solution.ts and solution.test.ts: $readme"
              exit 1
            fi
          done

      - name: Commit Codex solutions
        if: steps.check-tasks.outputs.has_todos == 'true'
        run: |
          git config user.name "Codex Bot"
          git config user.email "codex@openai.com"

          git add problems/ codex-output.md

          if ! git diff --cached --quiet; then
            git commit -m "🤖 Codex: Implement TODO tasks

            Generated solutions for LeetCode problems.
            Waiting for DeepSeek review."

            git push origin "$BRANCH_NAME"
          else
            echo "No changes made by Codex"
            exit 1
          fi

      - name: Create Pull Request
        if: steps.check-tasks.outputs.has_todos == 'true'
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          PR_BODY="## 🤖 Codex Implementation Report

          This PR contains automated solutions for TODO tasks in task.md.

          **Status:** Awaiting DeepSeek review 👀

          ### Codex Output
          \`\`\`
          $(cat codex-output.md 2>/dev/null || echo "No output file generated")
          \`\`\`

          ---
          🔄 Ready for manual or DeepSeek review"

          PR_URL=$(gh pr create \
            --title "🤖 Codex Solutions - $(date +%Y%m%d-%H%M%S)" \
            --body "$PR_BODY" \
            --base main \
            --head "$BRANCH_NAME")

          echo "Created PR: $PR_URL"

          gh pr edit "$PR_URL" --add-label "codex-submission" 2>/dev/null || echo "Label 'codex-submission' not found, skipping"
          gh pr edit "$PR_URL" --add-label "needs-review" 2>/dev/null || echo "Label 'needs-review' not found, skipping"
